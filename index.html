<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PedagoKit — Gestor Avançado de Grupos</title>
  
  <style>
    /* VARIÁVEIS E RESET */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap');
    :root {
      --primary: #0077b6; --primary-dark: #023e8a; --accent: #f7a072; 
      --light-bg: #f8f9fa; --white: #ffffff; --text-dark: #343a40; 
      --border-color: #e9ecef; --danger: #e63946; --success: #52b788;
      --font-body: 'Inter', sans-serif; --font-header: 'Poppins', sans-serif;
      --radius: 8px; --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--light-bg); color: var(--text-dark); line-height: 1.6; }
    
    /* LAYOUT */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: grid; gap: 20px; }
    header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 24px; text-align: center; border-radius: 0 0 16px 16px; margin-bottom: 20px; }
    header h1 { font-family: var(--font-header); font-size: 2rem; }
    
    /* COMPONENTES */
    .card { background: white; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 300px; }
    
    textarea, input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius); margin-bottom: 12px; font-family: inherit; }
    textarea { min-height: 180px; font-family: monospace; font-size: 0.9rem; }
    
    .btn { background: var(--accent); color: #222; font-weight: 600; border: none; padding: 12px 20px; border-radius: var(--radius); cursor: pointer; transition: 0.2s; width: 100%; }
    .btn:hover { filter: brightness(0.95); transform: translateY(-1px); }
    .btn--secondary { background: white; border: 1px solid #ccc; color: #555; margin-bottom: 0; }
    
    /* RESULTADOS */
    .grid-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 20px; }
    .group-card { background: #fdfdfd; border: 1px solid #eee; padding: 16px; border-radius: var(--radius); position: relative; }
    .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid var(--primary); }
    .group-avg { font-size: 0.85rem; font-weight: bold; color: var(--primary); background: #e0f2fe; padding: 2px 6px; border-radius: 4px; }
    
    .student-item { font-size: 0.95rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .tag { font-size: 0.7rem; font-weight: bold; padding: 2px 5px; border-radius: 4px; color: white; min-width: 20px; text-align: center; }
    .tag--m { background-color: #3b82f6; } /* Azul */
    .tag--f { background-color: #ec4899; } /* Rosa */
    .grade-pill { font-size: 0.75rem; background: #eee; padding: 1px 5px; border-radius: 4px; color: #555; }
    
    .analysis-box { background: #f0f9ff; border-left: 5px solid var(--primary); padding: 16px; margin-top: 20px; }
    .highlight-red { color: var(--danger); font-weight: bold; font-size: 1.2rem; }
    
    .helper-text { font-size: 0.85rem; color: #666; background: #f8f9fa; padding: 10px; border-radius: var(--radius); margin-top: 10px; }
  </style>
</head>
<body>

<header>
  <h1>PedagoKit v3.0</h1>
  <p>Gestor Inteligente: Notas, Gênero e Regras de Convivência</p>
</header>

<div class="container">

  <div class="card">
    <div class="row">
      
      <div class="col">
        <label><strong>1. Lista de Alunos (CSV)</strong></label>
        <textarea id="inputStudents" placeholder="Formato: Nome, Gênero, Evitar, Juntar, Nota1..."></textarea>
        
        <div style="display: flex; gap: 10px;">
          <button id="btnPasteSample" class="btn btn--secondary">Exemplo Completo</button>
          <button id="btnClear" class="btn btn--secondary">Limpar</button>
        </div>

        <div class="helper-text">
          <strong>Legenda das Colunas:</strong><br>
          1. Nome <br>
          2. Gênero (M/F)<br>
          3. Evitar (Nome de quem não pode estar junto)<br>
          4. Juntar (Nome de quem DEVE estar junto)<br>
          5+. Notas (separadas por vírgula)
        </div>
      </div>

      <div class="col">
        <label><strong>2. Configuração dos Grupos</strong></label>
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
          <select id="mode" style="margin-bottom:0;">
            <option value="numGroups">Nº de Grupos</option>
            <option value="groupSize">Tam. Máximo do Grupo</option>
          </select>
          <input type="number" id="value" min="1" value="4" style="margin-bottom:0;">
        </div>

        <label><strong>3. Critério (Algoritmo)</strong></label>
        <select id="balanceMode">
          <option value="random">1. Aleatório Simples</option>
          <option value="grades">2. Equilibrado por Notas (Heterogêneo)</option>
          <option value="gender_het">3. Gênero Misto (Equilibrado)</option>
          <option value="gender_hom">4. Gênero Homogêneo (Meninos c/ Meninos)</option>
          <option value="rules">5. Aleatório com Regras (Evitar/Juntar)</option>
          <option value="grades_rules">6. Híbrido: Notas + Regras (Avançado)</option>
        </select>

        <button id="btnGenerate" class="btn">Gerar Grupos Agora</button>
        
        <div id="quickStats" style="margin-top: 15px; padding: 10px; background: #eee; border-radius: var(--radius); display: none;">
          </div>
      </div>
    </div>
  </div>

  <div id="resultSection" class="card" style="display: none;">
    <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">Grupos Gerados</h3>
    <div id="groupsGrid" class="grid-groups"></div>
    <button id="btnExport" class="btn btn--secondary" style="margin-top: 20px;">Baixar CSV</button>
  </div>

  <div id="analysisSection" class="card" style="display: none;">
    <h3>Análise de Impacto (Dados para a Banca)</h3>
    <div id="analysisContent"></div>
  </div>

</div>

<script>
/* --- LÓGICA E ALGORITMOS --- */

// 1. Parser (Transforma texto em objetos)
function parseStudents(raw) {
  const lines = raw.split('\n').filter(l => l.trim());
  return lines.map(line => {
    const parts = line.split(/[,;\t]+/).map(p => p.trim());
    const grades = parts.slice(4).map(g => parseFloat(g)).filter(n => !isNaN(n));
    const avg = grades.length ? grades.reduce((a,b)=>a+b,0)/grades.length : 0;
    
    return {
      id: parts[0].toLowerCase(), // ID para busca
      name: parts[0],
      gender: parts[1] ? parts[1].toUpperCase().charAt(0) : '?',
      avoid: parts[2] ? parts[2].toLowerCase() : null,
      mustPair: parts[3] ? parts[3].toLowerCase() : null,
      grades: grades,
      avg: Math.round(avg * 100) / 100
    };
  });
}

// 2. Estatísticas Simples
function getStats(students) {
  const avgs = students.map(s => s.avg);
  const mean = avgs.reduce((a,b)=>a+b,0) / avgs.length;
  const variance = avgs.reduce((a,b)=>a + Math.pow(b-mean, 2), 0) / avgs.length;
  return { mean: mean.toFixed(2), stdDev: Math.sqrt(variance).toFixed(2) };
}

// 3. Gerador Principal
function generate(students, opts) {
  // A. Define número de grupos (K)
  let k = opts.value;
  if (opts.mode === 'groupSize') {
    // Correção do Bug de Tamanho: Math.ceil garante grupos suficientes
    k = Math.ceil(students.length / opts.value);
  }
  
  // Inicializa grupos vazios
  let groups = Array.from({length: k}, () => []);
  let pool = [...students]; // Cópia para não alterar original

  // B. Seleção de Algoritmo
  
  // --- MODO 4: GÊNERO HOMOGÊNEO (Novo) ---
  if (opts.algo === 'gender_hom') {
    // Separa por gênero
    const boys = pool.filter(s => s.gender === 'M');
    const girls = pool.filter(s => s.gender !== 'M');
    
    // Distribui Meninos nos primeiros grupos até encher ou acabar
    let currentGroup = 0;
    
    // Função auxiliar para distribuir lista sequencialmente
    const fillSequential = (list) => {
      list.forEach(s => {
        groups[currentGroup].push(s);
        // Avança grupo se atingiu tamanho ideal (distribuição equilibrada) ou round-robin
        // Para homogêneo simples, vamos usar Round-Robin mas restrito aos grupos
        currentGroup = (currentGroup + 1) % k;
      });
    };
    
    // *Estratégia Melhorada*: Tentar encher grupos inteiros com um gênero
    // Mas para MVP simples, vamos distribuir meninos nos grupos 0, 1... 
    // e meninas nos grupos K, K-1... (inverso) para tentar segregar
    
    // Vamos usar uma estratégia de "Buckets": 
    // Grupos de meninos e Grupos de meninas.
    const kBoys = Math.round((boys.length / pool.length) * k) || 1;
    const kGirls = k - kBoys;
    
    // Distribui meninos nos primeiros kBoys grupos
    boys.forEach((s, i) => groups[i % kBoys].push(s));
    
    // Distribui meninas nos grupos restantes
    // Se só tiver 1 tipo, vai tudo pro mesmo, ok.
    if (kGirls > 0) {
      girls.forEach((s, i) => groups[kBoys + (i % kGirls)].push(s));
    } else {
      // Fallback se proporção der errado
      girls.forEach((s, i) => groups[i % k].push(s));
    }

  } 
  
  // --- MODO 2: NOTAS (Greedy / Snake) ---
  else if (opts.algo === 'grades') {
    pool.sort((a,b) => b.avg - a.avg); // Ordena pela nota
    
    // Distribuição Cobra (Snake)
    pool.forEach((s, i) => {
       // Acha o grupo com a menor soma de médias atual
       let bestG = 0;
       let minSum = Infinity;
       groups.forEach((g, idx) => {
         const sum = g.reduce((acc, curr) => acc + curr.avg, 0);
         if (sum < minSum && g.length < Math.ceil(pool.length/k)) { // Respeita limite aprox
            minSum = sum;
            bestG = idx;
         }
       });
       groups[bestG].push(s);
    });
  }

  // --- MODO 3: GÊNERO MISTO (Equilibrado) ---
  else if (opts.algo === 'gender_het') {
    const boys = pool.filter(s => s.gender === 'M');
    const girls = pool.filter(s => s.gender !== 'M');
    
    // Distribui meninos circularmente
    boys.forEach((s, i) => groups[i % k].push(s));
    // Distribui meninas circularmente
    girls.forEach((s, i) => groups[i % k].push(s));
  }

  // --- MODO 5 e 6: REGRAS e HÍBRIDO (Avançado) ---
  else if (opts.algo === 'rules' || opts.algo === 'grades_rules') {
    
    // 1. Processar PARES (Must Pair) -> Cria "Blocos"
    let blocks = [];
    let processed = new Set();
    
    // Ordena pool por nota se for híbrido
    if (opts.algo === 'grades_rules') {
      pool.sort((a,b) => b.avg - a.avg);
    } else {
      pool.sort(() => Math.random() - 0.5); // Aleatório
    }

    pool.forEach(s => {
      if (processed.has(s.id)) return;
      
      let block = [s];
      processed.add(s.id);
      
      if (s.mustPair) {
        // Busca o par
        let partner = pool.find(p => p.name.toLowerCase().includes(s.mustPair) || p.id === s.mustPair);
        if (partner && !processed.has(partner.id)) {
          block.push(partner);
          processed.add(partner.id);
        }
      }
      blocks.push(block);
    });

    // 2. Distribuir Blocos respeitando EVITAR
    // Se for híbrido, blocos com maiores médias primeiro
    if (opts.algo === 'grades_rules') {
      blocks.sort((a,b) => {
        const avgA = a.reduce((sum, x)=>sum+x.avg,0)/a.length;
        const avgB = b.reduce((sum, x)=>sum+x.avg,0)/b.length;
        return avgB - avgA;
      });
    }

    blocks.forEach(block => {
      // Tenta achar um grupo válido
      // Estratégia: Procura o grupo mais vazio (ou com menor média) que não tenha conflito
      
      // Ordena índices dos grupos por prioridade (ex: menor soma de notas ou menor tamanho)
      let groupIndices = Array.from({length: k}, (_, i) => i);
      
      if (opts.algo === 'grades_rules') {
        // Prioriza grupos com menor soma de notas
        groupIndices.sort((a,b) => {
          const sumA = groups[a].reduce((acc, x)=>acc+x.avg,0);
          const sumB = groups[b].reduce((acc, x)=>acc+x.avg,0);
          return sumA - sumB;
        });
      } else {
        // Prioriza grupos menores (balanceamento de tamanho)
        groupIndices.sort((a,b) => groups[a].length - groups[b].length);
      }

      let placed = false;

      for (let gIdx of groupIndices) {
        // Verifica conflito
        let conflict = false;
        const targetGroup = groups[gIdx];
        
        for (let member of targetGroup) {
          for (let newcomer of block) {
            // Verifica Evitar bidirecionalmente
            if ((member.avoid && (member.avoid === newcomer.id || member.avoid === newcomer.name.toLowerCase())) ||
                (newcomer.avoid && (newcomer.avoid === member.id || newcomer.avoid === member.name.toLowerCase()))) {
              conflict = true;
              break;
            }
          }
          if (conflict) break;
        }

        if (!conflict) {
          groups[gIdx].push(...block);
          placed = true;
          break;
        }
      }

      // Fallback: Se der conflito em todos, coloca no grupo menor (não tem jeito)
      if (!placed) {
        // Re-ordena por tamanho puramente para evitar superlotar um grupo
        groupIndices.sort((a,b) => groups[a].length - groups[b].length);
        groups[groupIndices[0]].push(...block);
      }
    });
  }

  // --- MODO 1: ALEATÓRIO PURO ---
  else {
    pool.sort(() => Math.random() - 0.5);
    pool.forEach((s, i) => groups[i % k].push(s));
  }

  return groups;
}

/* --- INTERFACE E DOM --- */

const txtInput = document.getElementById('inputStudents');
const btnGenerate = document.getElementById('btnGenerate');
const divGroups = document.getElementById('groupsGrid');
const divStats = document.getElementById('quickStats');
const divAnalysis = document.getElementById('analysisContent');

// Carregar Exemplo
document.getElementById('btnPasteSample').addEventListener('click', () => {
  txtInput.value = 
`Ana, F, , Bia, 9.0, 9.5
Bia, F, , Ana, 6.0, 5.5
Carlos, M, João, , 5.0, 4.0
João, M, Carlos, , 8.0, 8.5
Pedro, M, , , 7.0, 7.5
Mariana, F, , , 8.5, 9.0
Lucas, M, , , 4.5, 5.0
Fernanda, F, , , 9.5, 10.0
Ricardo, M, , , 6.0, 6.5
Julia, F, , , 7.5, 8.0
Roberto, M, , , 3.0, 4.0
Sofia, F, , , 9.0, 9.0`;
});

document.getElementById('btnClear').addEventListener('click', () => txtInput.value = '');

// Botão Gerar
btnGenerate.addEventListener('click', () => {
  const students = parseStudents(txtInput.value);
  if (!students.length) return alert("Insira dados válidos!");

  // Configurações
  const opts = {
    mode: document.getElementById('mode').value,
    value: parseInt(document.getElementById('value').value),
    algo: document.getElementById('balanceMode').value
  };

  // Processa
  const groups = generate(students, opts);
  const stats = getStats(students);

  // Renderiza Stats Básicos
  divStats.style.display = 'block';
  divStats.innerHTML = `
    <strong>Média Geral da Turma:</strong> ${stats.mean} | 
    <strong>Desvio Padrão:</strong> ${stats.stdDev} <br>
    <small>Total: ${students.length} alunos em ${groups.length} grupos.</small>
  `;

  // Renderiza Grupos
  document.getElementById('resultSection').style.display = 'block';
  divGroups.innerHTML = '';
  
  groups.forEach((g, i) => {
    const gAvg = g.length ? (g.reduce((a,b)=>a+b.avg,0)/g.length).toFixed(2) : '0';
    const card = document.createElement('div');
    card.className = 'group-card';
    
    let listHtml = g.map(s => {
      let badge = '';
      if(s.gender === 'M') badge = '<span class="tag tag--m">M</span>';
      if(s.gender === 'F') badge = '<span class="tag tag--f">F</span>';
      
      let gradesHtml = s.grades.map(gr => `<span class="grade-pill">${gr}</span>`).join('');
      
      return `<div class="student-item">
                ${badge} <strong>${s.name}</strong> (${s.avg}) ${gradesHtml}
              </div>`;
    }).join('');

    card.innerHTML = `
      <div class="group-header">
        <strong>Grupo ${i+1}</strong>
        <span class="group-avg">Méd: ${gAvg}</span>
      </div>
      ${listHtml}
    `;
    divGroups.appendChild(card);
  });

  // Renderiza Análise (Foco de Intervenção)
  renderAnalysis(students);
});

function renderAnalysis(students) {
  if(!students[0].grades.length) return;
  document.getElementById('analysisSection').style.display = 'block';

  // Lógica: Pega os 3 piores alunos (Prioritários)
  const sorted = [...students].sort((a,b) => a.avg - b.avg);
  const bottom3 = sorted.slice(0, 3);
  
  // Descobre qual a pior prova DELES
  let numExams = students[0].grades.length;
  let worstExamIdx = -1;
  let worstExamAvg = Infinity;
  let classAvgAtWorst = 0;

  for(let i=0; i<numExams; i++) {
    // Média do grupo prioritário nesta prova
    let sumP = 0; 
    let countP = 0;
    bottom3.forEach(s => {
      if(s.grades[i] !== undefined) { sumP += s.grades[i]; countP++; }
    });
    let avgP = countP ? sumP/countP : 0;

    if (avgP < worstExamAvg) {
      worstExamAvg = avgP;
      worstExamIdx = i;
      
      // Calcula média da turma nessa prova para comparar
      let sumC = 0; students.forEach(s => sumC += (s.grades[i]||0));
      classAvgAtWorst = sumC / students.length;
    }
  }

  const gap = (classAvgAtWorst - worstExamAvg).toFixed(2);

  let html = `
    <div class="analysis-box">
      <div style="text-align: center;">
        <p style="margin-bottom: 5px; font-weight: bold; color: #555;">Foco de Intervenção Sugerido</p>
        <div class="highlight-red">Avaliação ${worstExamIdx + 1}</div>
        <p style="font-size: 0.9rem; margin-top: 10px;">
          Os alunos com maior dificuldade tiveram média <strong>${worstExamAvg.toFixed(2)}</strong> nesta avaliação.<br>
          A média geral da turma foi <strong>${classAvgAtWorst.toFixed(2)}</strong> (Gap de ${gap}).
        </p>
      </div>
      <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
      <strong>Alunos Prioritários:</strong>
      <ul style="margin-top: 5px; padding-left: 20px;">
        ${bottom3.map(s => `<li>${s.name} (Méd: ${s.avg})</li>`).join('')}
      </ul>
    </div>
  `;
  divAnalysis.innerHTML = html;
}

// Export CSV Simples
document.getElementById('btnExport').addEventListener('click', () => {
  const data = document.getElementById('inputStudents').value;
  const blob = new Blob([data], {type: 'text/csv'});
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('hidden', '');
  a.setAttribute('href', url);
  a.setAttribute('download', 'meus_grupos.csv');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

</script>
</body>
</html>
